name: Test-App bauen

on:
  push:
    branches: [main]
    # Änderungen nur an Prüf- und Export-Abläufen bauen keine neue Test-App.
    paths-ignore:
      - 'README.md'
      - '.github/workflows/modelle.yml'
      - '.github/workflows/modell-export.yml'
      - 'tools/export/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-app
  cancel-in-progress: false

env:
  # Stufe 2 des Machbarkeitstests: Versionen 0.2.x
  CINEBO_VERSION: 0.3.${{ github.run_number }}
  # Welche selbst exportierten EdgeTAM-Teile in die App kommen (Release modelle-<Version>)
  MODELLE_VERSION: '2'
  # Größer darf die APK nicht werden; alles Große lädt die App selbst.
  APK_MAX_MB: '40'

jobs:
  apk:
    name: APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # Die KI-Modelle und die große QNN-Laufzeit liegen nie im Repo und auch nicht in der APK.
      # Die Modelle (Qualcomms von AI Hub, unsere EdgeTAM-Teile aus dem Release modelle-<Version>)
      # landen einmal, für die Übertragung gepackt, im Release ki-modelle-<Satz>. Die QNN-Laufzeit
      # geben wir nicht weiter (Qualcomms Lizenz erlaubt das nur eingebaut in eine App): Die App
      # holt Qualcomms Paket selbst von Maven Central und entpackt daraus, was sie braucht. Die
      # App bekommt nur die Liste mit Adressen, Größen und Prüfsummen und lädt alles selbst, mit
      # Fortsetzen nach Abbrüchen. Solange sich keine Datei ändert, bleibt der Satz gleich, und
      # eine neue Test-App lädt nichts neu.
      - name: KI-Dateien bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Alles auch in ki-log.txt, damit ein Fehler im Protokoll-Release landet.
          {
            roh=dl/ki
            mkdir -p "$roh"
            s3=https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models
            curl -fsSL --retry 3 -o dl/depth.zip "$s3/depth_anything_v2/releases/v0.63.0/depth_anything_v2-tflite-float.zip"
            curl -fsSL --retry 3 -o dl/float.zip "$s3/edgetam/releases/v0.61.0/edgetam-tflite-float.zip"
            curl -fsSL --retry 3 -o dl/w8a8.zip "$s3/edgetam/releases/v0.61.0/edgetam-tflite-w8a8.zip"
            for z in depth float w8a8; do unzip -q -o "dl/$z.zip" -d "dl/$z"; done
            cp dl/depth/*/depth_anything_v2.tflite "$roh/depth_anything_v2.tflite"
            cp dl/float/*/encoder.tflite "$roh/edgetam_encoder.tflite"
            cp dl/float/*/video_decoder.tflite "$roh/edgetam_decoder.tflite"
            cp dl/float/*/memory_encoder.tflite "$roh/edgetam_memory_encoder_qualcomm.tflite"
            cp dl/w8a8/*/encoder.tflite "$roh/edgetam_encoder_w8a8.tflite"
            cp dl/w8a8/*/video_decoder.tflite "$roh/edgetam_decoder_w8a8.tflite"
            cp dl/w8a8/*/memory_encoder.tflite "$roh/edgetam_memory_encoder_w8a8.tflite"
            rel="https://github.com/${{ github.repository }}/releases/download/modelle-$MODELLE_VERSION"
            for f in edgetam_memory_attention.tflite edgetam_memory_attention_v2.tflite edgetam_memory_encoder.tflite \
                     edgetam_memory_prep.tflite edgetam_decoder_meta.tflite edgetam_konstanten.json edgetam_pruefvideo.zip; do
              curl -fsSL --retry 3 -o "$roh/$f" "$rel/$f"
            done
            # Qualcomms QNN-Laufzeit für den KI-Chip, genau so, wie die App sie von Maven Central holt.
            # Die Version steht an einer Stelle (gradle.properties), passend zum Delegate in der App.
            QNN_VERSION=$(sed -n 's/^cinebo\.qnnVersion=//p' gradle.properties)
            if [ -z "$QNN_VERSION" ]; then echo "cinebo.qnnVersion fehlt in gradle.properties"; exit 1; fi
            aar="qnn-runtime-$QNN_VERSION.aar"
            aar_url="https://repo1.maven.org/maven2/com/qualcomm/qti/qnn-runtime/$QNN_VERSION/$aar"
            qnn_libs="libQnnHtp.so libQnnHtpPrepare.so libQnnSystem.so libQnnHtpV81Stub.so libQnnHtpV81Skel.so libQnnHtpV79Stub.so libQnnHtpV79Skel.so"
            curl -fsSL --retry 3 -o "dl/$aar" "$aar_url"
            mkdir -p dl/qnn
            for f in $qnn_libs; do
              unzip -q -o -j "dl/$aar" "jni/arm64-v8a/$f" -d dl/qnn
            done
            { (cd "$roh" && sha256sum -- *); (cd dl/qnn && sha256sum -- *); (cd dl && sha256sum -- "$aar"); } \
              | LC_ALL=C sort -k2 > ki-dateien.sha256
            cat ki-dateien.sha256
            # Festgeschriebene Dateien müssen genau die geprüften sein; sonst bricht der Bau ab.
            (cd "$roh" && sha256sum -c --quiet "$GITHUB_WORKSPACE/.github/modelle.sha256")

            # App und Bau-Skript müssen dasselbe Listenformat sprechen.
            format_app=$(sed -n 's/.*const val LIST_FORMAT = \([0-9][0-9]*\).*/\1/p' app/src/main/java/de/botrik/cinebo/test/ModelStore.kt)
            format_bau=$(python3 .github/ki_dateien.py format | awk '{print $2}')
            if [ -z "$format_app" ] || [ "$format_app" != "$format_bau" ]; then
              echo "Listenformat passt nicht: App ${format_app:-?}, Bau-Skript $format_bau"
              exit 1
            fi
            # Setzt Maven Central abgebrochene Übertragungen fort? (206 = ja; sonst beginnt die App von vorn)
            echo "Maven Central, Teilbereich: HTTP $(curl -s -o /dev/null -r 1000-1999 -w '%{http_code}' "$aar_url")" | tee maven-fortsetzen.txt

            # Der Satz heißt nach den Prüfsummen aller fertigen Dateien und dem Aufbau der Liste.
            satz=$( { cat ki-dateien.sha256; python3 .github/ki_dateien.py format; } | sha256sum | cut -c1-10)
            tag="ki-modelle-$satz"
            basis="https://github.com/${{ github.repository }}/releases/download/$tag/"
            echo "KI_SATZ=$satz" >> "$GITHUB_ENV"
            cp .github/ki-lizenzen.txt dl/LIZENZEN.txt
            # Nur „gibt es nicht“ heißt neu anlegen; jeder andere Fehler der Abfrage bricht ab.
            if ausgabe=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>&1); then
              vorhanden="$ausgabe"
              anlegen=0
            elif grep -qi 'release not found' <<< "$ausgabe"; then
              vorhanden=""
              anlegen=1
            else
              echo "GitHub-Abfrage zu $tag gescheitert: $ausgabe"
              exit 1
            fi
            if grep -qx 'liste.json' <<< "$vorhanden"; then
              # Ein vollständiger Satz wird nie überschrieben: Ältere Apps laden genau diese Dateien.
              echo "KI-Satz $satz liegt schon vollständig im Release $tag."
            else
              # shellcheck disable=SC2086
              python3 .github/ki_dateien.py packen "$roh" dl/laden "$basis" "$satz" \
                --archiv "dl/$aar" "$aar_url" jni/arm64-v8a $qnn_libs > dl/liste.json
              if [ "$anlegen" = 1 ]; then
                gh release create "$tag" --prerelease --latest=false \
                  --target "${{ github.sha }}" --title "KI-Modelle für die Test-App ($satz)" \
                  --notes "KI-Modelle der Test-App, für die Übertragung gepackt. Die App lädt sie selbst und prüft jede Datei; liste.json beschreibt den Satz, LIZENZEN.txt nennt die Lizenzen. Die QNN-Laufzeit holt die App direkt von Qualcomm (Maven Central)."
              fi
              gh release upload "$tag" dl/laden/* dl/LIZENZEN.txt --clobber
              # Zuletzt die Liste: Erst mit ihr gilt der Satz als vollständig.
              gh release upload "$tag" dl/liste.json --clobber
            fi

            # Alles aus dem Release zurückholen und so prüfen, wie es die App tut.
            rm -rf dl/release
            gh release download "$tag" --dir dl/release
            # Die Lizenztexte darf jeder Bau auf den neuesten Stand bringen; die App liest sie nicht.
            if ! cmp -s dl/LIZENZEN.txt dl/release/LIZENZEN.txt; then
              gh release upload "$tag" dl/LIZENZEN.txt --clobber
              cp dl/LIZENZEN.txt dl/release/LIZENZEN.txt
            fi
            python3 .github/ki_dateien.py pruefen dl/release/liste.json "$roh" dl/release "$basis" "dl/$aar"
            mkdir -p app/src/main/assets
            cp dl/release/liste.json app/src/main/assets/modelle.json
            python3 .github/ki_dateien.py uebersicht app/src/main/assets/modelle.json | tee ki-dateien.txt
          } 2>&1 | tee -a ki-log.txt

      # Erst die Prüfungen ohne Handy (app/src/test), dann die APK.
      - name: APK bauen
        shell: bash
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      # Was in der APK steckt und was die App selbst lädt. Danach wacht ki_dateien.py darüber,
      # dass die APK klein bleibt und jede Bibliothek auf dem Handy findet, was sie braucht.
      - name: Bau-Info
        shell: bash
        run: |
          {
            apk=app/build/outputs/apk/release/app-release.apk
            rm -rf apkx && mkdir -p apkx
            unzip -q -o "$apk" 'lib/*' -d apkx
            {
              echo "CineBo Test $CINEBO_VERSION · Stand ${{ github.sha }} · KI-Satz $KI_SATZ"
              echo
              echo "== APK"
              stat -c '%s Bytes' "$apk"
              echo
              echo "== KI-Dateien, die die App beim ersten Start selbst lädt"
              cat ki-dateien.txt
              cat maven-fortsetzen.txt
              echo
              echo "== Prüfsummen der fertigen KI-Dateien (sha256)"
              cat ki-dateien.sha256
              echo
              echo "== Bibliotheken: Bytes und Ausrichtung der LOAD-Segmente"
              for f in apkx/lib/arm64-v8a/*.so dl/qnn/*.so; do
                case "$f" in apkx/*) wo="APK" ;; *) wo="nachgeladen" ;; esac
                printf '%s %s %s ' "$(basename "$f")" "$wo" "$(stat -c %s "$f")"
                readelf -lW "$f" | awk '$1 == "LOAD" {print $NF}' | sort -u | tr '\n' ' '
                echo
              done
            } > bau-info.txt
            cat bau-info.txt
            python3 .github/ki_dateien.py apk "$apk" app/src/main/assets/modelle.json "$APK_MAX_MB" dl/qnn
          } 2>&1 | tee -a pruef-log.txt

      # Schlägt etwas fehl, liegen die Protokolle als Datei im Release „ci-log“.
      - name: Fehlerprotokoll hochladen
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Lauf ${{ github.run_number }} · Stand ${{ github.sha }}"
            for f in ki-log.txt build-log.txt pruef-log.txt; do
              if [ -f "$f" ]; then
                echo
                echo "== $f"
                cat "$f"
              fi
            done
          } > ci-log.txt
          gh release view ci-log >/dev/null 2>&1 || gh release create ci-log --prerelease --latest=false \
            --title "Build-Protokoll" --notes "Protokoll des letzten fehlgeschlagenen Builds."
          gh release upload ci-log ci-log.txt --clobber

      - name: Als Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk cinebo-test.apk
          gh release create "test-${{ github.run_number }}" cinebo-test.apk bau-info.txt \
            --target "${{ github.sha }}" \
            --title "CineBo Test $CINEBO_VERSION" \
            --notes "Testversion $CINEBO_VERSION für das OPPO Find N6: Grafik-Pipeline mit KI und Unschärfe (Stufe 3). Die KI-Modelle lädt die App beim ersten Start selbst (KI-Satz $KI_SATZ)." \
            --latest
