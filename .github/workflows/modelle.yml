name: Modelle und KI-Bibliotheken prüfen

# Lädt die KI-Modelle und die Qualcomm-Bibliotheken und schreibt auf, wie sie
# aufgebaut sind (Ein- und Ausgaben, Datentypen, Klassen). Das Ergebnis liegt
# danach als Datei im Release „modell-info“. Jeder Schritt läuft auch dann
# weiter, wenn etwas fehlt, damit der Bericht möglichst vollständig ist.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/modelle.yml']

permissions:
  contents: write

jobs:
  info:
    name: Modelle vermessen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Modelle laden
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p work && cd work
          base=https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models
          for u in depth_anything_v2/releases/v0.63.0/depth_anything_v2-tflite-float.zip \
                   edgetam/releases/v0.61.0/edgetam-tflite-float.zip \
                   edgetam/releases/v0.61.0/edgetam-tflite-w8a8.zip; do
            curl -fsSLO "$base/$u" || echo "FEHLT: $u" >> ../bericht-dateien.txt
          done
          for z in *.zip; do unzip -o -q "$z" -d "${z%.zip}"; done
          { echo "== Dateien (Bytes, Pfad)"; find . -type f -printf '%s\t%p\n' | sort -k2; } >> ../bericht-dateien.txt
          find . -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' -o -name '*.txt' -o -name '*.md' \) | sort | while read -r f; do
            { echo; echo "== $f"; head -c 6000 "$f"; echo; } >> ../bericht-dateien.txt
          done
          cat ../bericht-dateien.txt

      - name: Modelle vermessen
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          python3 -m venv venv
          . venv/bin/activate
          pip install -q ai-edge-litert numpy 2>&1 | tail -3
          pip show ai-edge-litert | head -3
          cat > inspect_models.py <<'EOF'
          import collections, glob, time, traceback
          import numpy as np
          from ai_edge_litert.interpreter import Interpreter

          def describe(path):
              print('=' * 72)
              print(path)
              it = Interpreter(model_path=path, num_threads=4)
              it.allocate_tensors()
              for kind, det in (('EIN', it.get_input_details()), ('AUS', it.get_output_details())):
                  for d in det:
                      q = d.get('quantization', (0.0, 0))
                      print(f"  {kind} {d['name']}: {list(d['shape'])} {d['dtype'].__name__} quant={q} index={d['index']}")
              try:
                  print('  Signaturen:', it.get_signature_list())
              except Exception as e:
                  print('  Signaturen: -', e)
              try:
                  ops = collections.Counter(o['op_name'] for o in it._get_ops_details())
                  print('  Ops:', sum(ops.values()), dict(sorted(ops.items(), key=lambda kv: -kv[1])))
              except Exception as e:
                  print('  Ops: -', e)
              # Ein Lauf auf der CPU mit einem Verlauf als Bild und Nullen sonst.
              for d in it.get_input_details():
                  shape = list(d['shape'])
                  if d['dtype'] == np.float32:
                      a = np.zeros(shape, dtype=np.float32)
                      if len(shape) == 4:
                          a[...] = np.linspace(0, 1, a.size, dtype=np.float32).reshape(shape)
                  else:
                      a = np.zeros(shape, dtype=d['dtype'])
                  it.set_tensor(d['index'], a)
              t = time.time(); it.invoke(); dt = time.time() - t
              print(f'  Testlauf CPU (4 Kerne): {dt * 1000:.0f} ms')
              for d in it.get_output_details():
                  o = it.get_tensor(d['index']).astype(np.float64)
                  print(f"    {d['name']}: min={o.min():.4f} max={o.max():.4f} mittel={o.mean():.4f}")

          for path in sorted(glob.glob('work/**/*.tflite', recursive=True)):
              try:
                  describe(path)
              except Exception:
                  traceback.print_exc()
          for path in sorted(glob.glob('work/**/*.npy', recursive=True)):
              a = np.load(path)
              print('=' * 72)
              print(f'{path}: {list(a.shape)} {a.dtype} min={a.min():.4f} max={a.max():.4f}')
          EOF
          python3 inspect_models.py 2>&1 | tee bericht-modelle.txt

      - name: Bibliotheken prüfen
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          shopt -s nullglob
          central=https://repo1.maven.org/maven2
          google=https://dl.google.com/android/maven2
          meta() { curl -fsSL "$1/$2/maven-metadata.xml"; }
          {
            for spec in "$central com/qualcomm/qti/qnn-litert-delegate" \
                        "$central com/qualcomm/qti/qnn-runtime" \
                        "$central com/qualcomm/qti/qnn-tflite-delegate" \
                        "$google com/google/ai/edge/litert/litert" \
                        "$central com/google/ai/edge/litert/litert" \
                        "$google com/google/ai/edge/litert/litert-api" \
                        "$google com/google/ai/edge/litert/litert-support" \
                        "$central org/tensorflow/tensorflow-lite"; do
              set -- $spec
              echo "== Versionen $2 ($1)"
              m=$(meta "$1" "$2")
              if [ -n "$m" ]; then
                echo "$m" | grep -o '<release>[^<]*</release>'
                echo "$m" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -15 | tr '\n' ' '
              else
                echo "nicht gefunden"
              fi
              echo
            done
          } > bericht-maven.txt 2>&1
          rel() { meta "$central" "com/qualcomm/qti/$1" | grep -o '<release>[^<]*</release>' | sed 's/<[^>]*>//g'; }
          vd=$(rel qnn-litert-delegate); vr=$(rel qnn-runtime)
          echo "Neueste Version Delegate: $vd · Laufzeit: $vr" | tee -a bericht-maven.txt
          mkdir -p aar && cd aar
          for pair in "qnn-litert-delegate $vd" "qnn-runtime $vr" "qnn-runtime $vd"; do
            set -- $pair
            [ -n "$2" ] || continue
            curl -fsSLO "$central/com/qualcomm/qti/$1/$2/$1-$2.aar"
            curl -fsSLO "$central/com/qualcomm/qti/$1/$2/$1-$2.pom"
          done
          {
            for p in *.pom; do echo "== $p"; cat "$p"; echo; done
            for a in *.aar; do
              echo "== Inhalt $a (Bytes, Pfad)"
              unzip -l "$a" | awk 'NF>=4 {print $1, $4}' | head -200
              mkdir -p "x-$a" && unzip -o -q "$a" -d "x-$a"
            done
            find . -name 'AndroidManifest.xml' -path '*x-*' | while read -r f; do echo "== $f"; cat "$f"; echo; done
            find . -name 'proguard.txt' -path '*x-*' | while read -r f; do echo "== $f"; cat "$f"; echo; done
            find . -name classes.jar | while read -r j; do
              echo "== Klassen in $j"
              unzip -l "$j" | grep -o 'com/qualcomm/[^ ]*\.class' | head -100
              unzip -l "$j" | grep -o 'com/qualcomm/[^ ]*\.class' | sed 's/\.class$//; s#/#.#g' | while read -r c; do
                echo "-- $c"
                javap -public -constants -classpath "$j" "$c" 2>&1 | head -150
              done
            done
          } >> ../bericht-maven.txt 2>&1
          cd ..
          tail -c 30000 bericht-maven.txt

      - name: Bericht hochladen
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Lauf ${{ github.run_number }} · Stand ${{ github.sha }}"; echo
            cat bericht-dateien.txt 2>/dev/null; echo
            cat bericht-modelle.txt 2>/dev/null; echo
            cat bericht-maven.txt 2>/dev/null; } > modell-info.txt
          gh release view modell-info >/dev/null 2>&1 || gh release create modell-info --prerelease --latest=false \
            --title "Modell-Info" --notes "Aufbau der KI-Modelle und Bibliotheken, automatisch erstellt."
          gh release upload modell-info modell-info.txt --clobber
