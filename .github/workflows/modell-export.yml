name: KI-Modelle exportieren

# Baut die EdgeTAM-Teile, die Qualcomm nicht fertig anbietet (Memory-Attention, eigener
# Memory-Encoder, Vorbereitung für Qualcomms Memory-Encoder), prüft sie Zahl für Zahl gegen
# das Original von Meta und legt sie mit Konstanten und Prüfvideo im Release
# „modelle-<Version>“ ab. Die Test-App lädt sie beim Bauen von dort. Mit Qualcomms Modellen
# rechnet der Export außerdem jede Kette der App auf der CPU nach (Messlatte für den KI-Chip).
# Ändert sich am Export etwas Grundlegendes, steigt MODELLE_VERSION, damit jede
# Version der Test-App genau weiß, welche Modelle sie enthält.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/export/**', '.github/workflows/modell-export.yml']

permissions:
  contents: write

concurrency:
  group: modell-export
  cancel-in-progress: false

env:
  MODELLE_VERSION: '2'
  EDGETAM_COMMIT: 7711e012a30a2402c4eaab637bdb00a521302c91
  EDGETAM_SHA256: ed2d4850b8792c239689b043c47046ec239b6e808a3d9b6ae676c803fd8780df

defaults:
  run:
    shell: bash

jobs:
  export:
    name: Exportieren und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7

      - name: EdgeTAM holen
        run: |
          git clone -q https://github.com/facebookresearch/EdgeTAM.git edgetam
          git -C edgetam checkout -q "$EDGETAM_COMMIT"
          echo "$EDGETAM_SHA256  edgetam/checkpoints/edgetam.pt" | sha256sum -c -

      - name: Werkzeuge installieren
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -q --upgrade pip
          pip install -q torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu \
            || pip install -q torch==2.13.0 torchvision==0.28.0
          pip install -q -r tools/export/requirements.txt
          python --version

      # Qualcomms EdgeTAM-Modelle, genau die, die auch in der App laufen (Prüfsummen wie beim Bau).
      - name: Qualcomms Modelle holen
        run: |
          set -u
          s3=https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/edgetam/releases/v0.61.0
          mkdir -p qc
          for z in float w8a8; do
            curl -fsSL --retry 3 -o "qc/$z.zip" "$s3/edgetam-tflite-$z.zip"
            unzip -q -o "qc/$z.zip" -d "qc/$z-zip"
            mkdir -p "qc/$z"
            cp qc/$z-zip/*/*.tflite "qc/$z/"
          done
          # Gleiche Dateien wie in der App? Namen dort: edgetam_<teil>[_w8a8].tflite
          pin() { awk -v n="$1" '$2 == n {print $1}' .github/modelle.sha256; }
          check() {
            want=$(pin "$2"); got=$(sha256sum "$1" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "$1 passt nicht zu $2 (${want:-fehlt} / $got)"; exit 1; fi
            echo "$1 = $2"
          }
          check qc/float/encoder.tflite edgetam_encoder.tflite
          check qc/float/video_decoder.tflite edgetam_decoder.tflite
          check qc/float/memory_encoder.tflite edgetam_memory_encoder_qualcomm.tflite
          check qc/w8a8/encoder.tflite edgetam_encoder_w8a8.tflite

      - name: Exportieren und prüfen
        run: |
          set -o pipefail
          . venv/bin/activate
          mkdir -p out
          python -I tools/export/edgetam_export.py --repo edgetam \
            --checkpoint edgetam/checkpoints/edgetam.pt --qualcomm qc/float --qualcomm-w8a8 qc/w8a8 \
            --out out 2>&1 | tee out/export-protokoll.txt
          pip freeze > out/pakete.txt
          (cd out && sha256sum *.tflite *.json *.zip > pruefsummen.txt && cat pruefsummen.txt)

      # Die Lizenztexte der Qualcomm-Bibliotheken, die die App nutzt, zum Nachlesen.
      - name: Lizenzen der Qualcomm-Bibliotheken lesen
        continue-on-error: true
        run: |
          set +e
          # Dieselbe QNN-Version wie in der App (gradle.properties).
          QNN_VERSION=$(sed -n 's/^cinebo\.qnnVersion=//p' gradle.properties)
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null
          central=https://repo1.maven.org/maven2/com/qualcomm/qti
          mkdir -p lic
          for a in qnn-runtime qnn-litert-delegate; do
            curl -fsSL -o "lic/$a.aar" "$central/$a/$QNN_VERSION/$a-$QNN_VERSION.aar"
            unzip -o -q "lic/$a.aar" 'LICENSE.pdf' 'NOTICE.txt' -d "lic/$a"
            { echo "===== $a $QNN_VERSION: LICENSE.pdf"; pdftotext -layout "lic/$a/LICENSE.pdf" - ; } >> out/lizenzen-qualcomm.txt
          done
          [ -f lic/qnn-runtime/NOTICE.txt ] && { echo "===== qnn-runtime: NOTICE.txt"; cat lic/qnn-runtime/NOTICE.txt; } >> out/lizenzen-qualcomm.txt
          wc -c out/lizenzen-qualcomm.txt

      # Ein Release modelle-<Version> wird nie überschrieben: Die Test-App prüft seine Dateien gegen
      # .github/modelle.sha256. Läuft der Export erneut, vergleicht er nur und meldet Unterschiede;
      # für geänderte Modelle steigt MODELLE_VERSION.
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="modelle-$MODELLE_VERSION"
          notes="EdgeTAM-Teile für den KI-Chip, Version $MODELLE_VERSION (EdgeTAM ${EDGETAM_COMMIT:0:7}). Automatisch erstellt und gegen das Original geprüft."
          if ausgabe=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>&1); then
            echo "Release $tag gibt es schon; es bleibt unverändert. Vergleich mit dem neuen Export:"
            gh release download "$tag" --pattern pruefsummen.txt --output alt-pruefsummen.txt --clobber
            diff alt-pruefsummen.txt out/pruefsummen.txt && echo "Gleich." || echo "Hinweis: Der neue Export weicht ab (siehe oben)."
          elif grep -qi 'release not found' <<< "$ausgabe"; then
            gh release create "$tag" --prerelease --latest=false \
              --target "${{ github.sha }}" --title "KI-Modelle $MODELLE_VERSION" --notes "$notes"
            gh release upload "$tag" out/*
          else
            echo "GitHub-Abfrage zu $tag gescheitert: $ausgabe"
            exit 1
          fi
