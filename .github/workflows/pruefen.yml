name: Zweig prüfen

# Jeder Zweig außer main wird übersetzt und ohne Handy geprüft (app/src/test), bevor er nach
# main kommt. Hier entsteht keine Test-App und kein Release; das macht erst build.yml in main.

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'README.md'
      - 'tools/export/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Übersetzen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Projekt holen
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # Dieselben Prüfungen wie beim Bauen der Test-App, nur ohne KI-Dateien und Veröffentlichen.
      - name: Übersetzen und prüfen
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace
